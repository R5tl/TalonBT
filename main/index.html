<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Talon</title>
<style>
  :root {
    --bg: #101410; --panel: #1a221a; --edge: #2c3a2c;
    --txt: #cfe3cf; --dim: #7a8f7a; --hot: #52d053;
    --a:#5fbf3f; --b:#d0453f; --x:#3f7fd0; --y:#d0b23f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font: 15px/1.4 system-ui, sans-serif; user-select:none; -webkit-user-select:none; }
  header { text-align:center; padding:10px 0 2px; }
  header h1 { margin:0; font-size:22px; letter-spacing:6px; color:var(--hot); }
  #status { text-align:center; color:var(--dim); font-size:12px; min-height:18px; }
  main { max-width:560px; margin:0 auto; padding:8px 12px 24px;
         display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:14px; }
  .pad, .cluster { background:var(--panel); border:1px solid var(--edge);
                   border-radius:16px; padding:12px; }
  button { border:1px solid var(--edge); background:#232d23; color:var(--txt);
           border-radius:10px; font:inherit; font-weight:600; cursor:pointer; }
  button:active, button.on { background:var(--hot); color:#0a120a; }
  /* d-pad */
  .dpad { display:grid; grid-template:repeat(3,52px)/repeat(3,52px); gap:4px; }
  .dpad button { font-size:20px; }
  .dpad .blank { visibility:hidden; }
  /* face buttons */
  .face { display:grid; grid-template:repeat(3,52px)/repeat(3,52px); gap:4px; }
  .face button { border-radius:50%; font-size:17px; color:#0d100d; border:none; }
  .face .bA { background:var(--a); } .face .bB { background:var(--b); }
  .face .bX { background:var(--x); } .face .bY { background:var(--y); }
  .face .bBlk { background:#333; color:#ddd; } .face .bWht { background:#ddd; color:#222; }
  .face button:active { filter:brightness(1.6); }
  /* centre buttons + triggers */
  .mid button { padding:10px 16px; }
  .trig { flex:1; display:flex; flex-direction:column; gap:4px; align-items:stretch; }
  .trig label { font-size:11px; color:var(--dim); text-align:center; }
  input[type=range] { width:100%; accent-color:var(--hot); }
  /* sticks */
  .sticks { display:flex; gap:14px; justify-content:center; }
  .stick { width:140px; height:140px; background:#182018; border:1px solid var(--edge);
           border-radius:14px; position:relative; }
  .knob { width:44px; height:44px; border-radius:50%; background:#31452f;
          border:2px solid var(--hot); position:absolute; left:48px; top:48px;
          pointer-events:none; }
  .stick span { position:absolute; bottom:4px; width:100%; text-align:center;
                font-size:10px; color:var(--dim); }
</style>
</head>
<body>
<header><h1>TALON</h1></header>
<div id="status">connecting…</div>
<main>
  <div class="row">
    <div class="pad dpad">
      <i class="blank"></i><button data-b="up">▲</button><i class="blank"></i>
      <button data-b="left">◀</button><i class="blank"></i><button data-b="right">▶</button>
      <i class="blank"></i><button data-b="down">▼</button><i class="blank"></i>
    </div>
    <div class="pad face">
      <i class="blank"></i><button class="bY" data-b="y">Y</button><button class="bBlk" data-b="black">●</button>
      <button class="bX" data-b="x">X</button><i class="blank"></i><button class="bWht" data-b="white">○</button>
      <i class="blank"></i><button class="bA" data-b="a">A</button><button class="bB" data-b="b">B</button>
    </div>
  </div>
  <div class="row cluster mid">
    <button data-b="back">BACK</button>
    <div class="trig"><label>LEFT TRIGGER</label><input type="range" id="lt" min="0" max="255" value="0"></div>
    <div class="trig"><label>RIGHT TRIGGER</label><input type="range" id="rt" min="0" max="255" value="0"></div>
    <button data-b="start">START</button>
  </div>
  <div class="sticks">
    <div class="stick" data-x="lx" data-y="ly"><div class="knob"></div><span>L STICK</span></div>
    <div class="stick" data-x="rx" data-y="ry"><div class="knob"></div><span>R STICK</span></div>
  </div>
  <div class="row cluster mid">
    <button data-b="ls">L CLICK</button>
    <button onclick="fetch('/api/release')">RELEASE ALL</button>
    <button data-b="rs">R CLICK</button>
  </div>
</main>
<script>
const api = p => fetch(p).catch(() => {});

// hold-style buttons
document.querySelectorAll('button[data-b]').forEach(el => {
  const b = el.dataset.b;
  const dn = e => { e.preventDefault(); el.classList.add('on'); api(`/api/btn?b=${b}&v=1`); };
  const up = () => { el.classList.remove('on'); api(`/api/btn?b=${b}&v=0`); };
  el.addEventListener('pointerdown', dn);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', e => { if (el.classList.contains('on')) up(); });
});

// triggers: live value while dragging, snap to 0 on release
['lt','rt'].forEach(id => {
  const el = document.getElementById(id);
  let t = 0;
  el.addEventListener('input', () => {
    const now = Date.now();
    if (now - t > 50) { t = now; api(`/api/axis?a=${id}&v=${el.value}`); }
  });
  const rel = () => { el.value = 0; api(`/api/axis?a=${id}&v=0`); };
  el.addEventListener('pointerup', rel);
  el.addEventListener('pointercancel', rel);
});

// sticks: drag anywhere in the square; Y up = +32767 (XID convention)
document.querySelectorAll('.stick').forEach(el => {
  const knob = el.querySelector('.knob');
  const ax = el.dataset.x, ay = el.dataset.y;
  let active = false, t = 0;
  const send = (x, y, force) => {
    const now = Date.now();
    if (!force && now - t < 50) return;
    t = now;
    api(`/api/axis?a=${ax}&v=${Math.round(x*32767)}`);
    api(`/api/axis?a=${ay}&v=${Math.round(y*32767)}`);
  };
  const move = e => {
    if (!active) return;
    const r = el.getBoundingClientRect();
    let x = ((e.clientX - r.left) / r.width) * 2 - 1;
    let y = -(((e.clientY - r.top) / r.height) * 2 - 1);
    x = Math.max(-1, Math.min(1, x)); y = Math.max(-1, Math.min(1, y));
    knob.style.left = ((x + 1) / 2 * r.width - 22) + 'px';
    knob.style.top  = ((1 - (y + 1) / 2) * r.height - 22) + 'px';
    send(x, y, false);
  };
  el.addEventListener('pointerdown', e => { active = true; el.setPointerCapture(e.pointerId); move(e); });
  el.addEventListener('pointermove', move);
  const rel = () => {
    if (!active) return;
    active = false;
    knob.style.left = '48px'; knob.style.top = '48px';
    send(0, 0, true);
  };
  el.addEventListener('pointerup', rel);
  el.addEventListener('pointercancel', rel);
});

// status poll
setInterval(async () => {
  try {
    const s = await (await fetch('/api/status')).json();
    document.getElementById('status').textContent =
      `${s.mounted ? 'CONNECTED to Xbox' : 'not enumerated'} · rssi ${s.rssi} dBm · ` +
      `reports ${s.in_ok}` + (s.rumble_l || s.rumble_r ? ` · rumble ${s.rumble_l}/${s.rumble_r}` : '');
  } catch (e) {
    document.getElementById('status').textContent = 'unreachable';
  }
}, 2000);
</script>
</body>
</html>
